name: cd

# Continuous Delivery: runs only after `ci` succeeded on master, then waits
# for a human approval (required reviewers on the `production` environment).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (default: current master)'
        required: false

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets live here; required reviewers on this environment = the approval gate.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha || github.sha }}
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy ${{ env.DEPLOY_SHA }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && bash scripts/deploy.sh '$DEPLOY_SHA' '${{ vars.HEALTHCHECK_URL }}'"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
