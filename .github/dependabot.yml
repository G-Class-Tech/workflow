version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Keeps the SHA-pinned actions in workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
